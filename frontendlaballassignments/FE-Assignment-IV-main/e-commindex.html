<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopEasy - Product Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">🛍️ ShopEasy</span>
      <span class="text-light small">Cart items: <span id="cartCount" class="badge bg-warning text-dark">0</span></span>
    </div>
  </nav>

  <div class="container">
    <div class="row">
      <!-- Products -->
      <div class="col-12" id="productsCol">
        <h4 class="mb-3">Products</h4>
        <div class="row g-4" id="productList"></div>
      </div>

      <!-- Cart (hidden until first item is added) -->
      <div class="col-lg-4 d-none" id="cartCol">
        <div class="card shadow-sm cart-card">
          <div class="card-header bg-dark text-white">
            <h5 class="mb-0">🛒 Shopping Cart</h5>
          </div>
          <div class="card-body p-0">
            <ul class="list-group list-group-flush" id="cartItems"></ul>
          </div>
          <div class="card-footer d-flex justify-content-between align-items-center">
            <strong>Grand Total</strong>
            <strong class="fs-5 text-success" id="grandTotal">₹0</strong>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
